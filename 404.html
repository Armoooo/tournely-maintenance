<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061f18">
  <meta name="robots" content="noindex,nofollow">
  <title>Tournely — Taking a short timeout</title>
  <meta name="description" content="Tournely is currently under maintenance and will return soon.">
  <style>
    :root{color-scheme:dark;--ink:#f8fbf8;--muted:#b9c9c1;--ball:#d8ed3a;--navy:#001e52;--blue:#003da5;--yellow:#ffcb05}
    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{display:grid;min-height:100vh;margin:0;overflow-x:hidden;grid-template-rows:1fr auto;background:#061f18;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 18% 10%,rgba(70,176,117,.22),transparent 32%),radial-gradient(circle at 88% 85%,rgba(216,237,58,.08),transparent 26%),linear-gradient(145deg,#061f18 0%,#082b21 52%,#041711 100%);pointer-events:none}
    .shell{position:relative;display:grid;min-height:calc(100vh - 72px);grid-template-rows:auto 1fr;width:min(1180px,100%);margin:auto;padding:20px clamp(22px,5vw,72px) 28px}
    .brand{display:inline-flex;width:220px;height:60px;overflow:hidden}
    .brand img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
    main{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(300px,.72fr);align-items:center;gap:clamp(46px,8vw,105px);padding:clamp(42px,7vh,76px) 0}
    .status{display:inline-flex;align-items:center;gap:9px;margin-bottom:24px;color:#dce8e2;font-size:.76rem;font-weight:750;letter-spacing:.12em;text-transform:uppercase}
    .status::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ball);box-shadow:0 0 0 6px rgba(216,237,58,.11)}
    h1{max-width:690px;margin:0;font-size:clamp(3.15rem,7vw,6.4rem);line-height:.92;letter-spacing:-.075em;text-wrap:balance}
    h1 span{color:var(--ball)}
    .copy{max-width:610px;margin:28px 0 0;color:var(--muted);font-size:clamp(1.05rem,1.7vw,1.3rem);line-height:1.65;text-wrap:pretty}
    .contact{display:inline-flex;align-items:center;gap:10px;min-height:48px;margin-top:36px;padding:0 20px;border:1px solid rgba(255,255,255,.24);border-radius:999px;color:#fff;font-size:.9rem;font-weight:750;text-decoration:none;transition:background .18s ease,border-color .18s ease,transform .18s ease}
    .contact:hover,.contact:focus-visible{border-color:var(--ball);background:rgba(216,237,58,.1);transform:translateY(-2px);outline:none}
    .contact svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
    .visual{position:relative;aspect-ratio:11/18;width:min(100%,350px);justify-self:end;filter:drop-shadow(0 34px 45px rgba(0,0,0,.3));transform:rotate(2deg)}
    .court-frame{position:absolute;inset:0;overflow:hidden;border:1px solid rgba(255,255,255,.19);border-radius:26px;background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.055) 0 1px,transparent 1.5px) 0 0/9px 9px,linear-gradient(155deg,#166f51,#064633);box-shadow:inset 0 0 70px rgba(0,0,0,.18)}
    .court{position:absolute;inset:7% 10%;border:2px solid rgba(255,255,255,.9);background:linear-gradient(90deg,rgba(255,255,255,.018) 50%,rgba(0,0,0,.025) 50%),linear-gradient(#137451,#0c6848);box-shadow:0 0 0 1px rgba(0,0,0,.15)}
    .line{position:absolute;z-index:1;background:rgba(255,255,255,.9)}
    .singles-left,.singles-right{top:0;bottom:0;width:2px}.singles-left{left:12.5%}.singles-right{right:12.5%}
    .service-top,.service-bottom{left:12.5%;right:12.5%;height:2px}.service-top{top:26.9%}.service-bottom{bottom:26.9%}
    .centre-service{top:26.9%;bottom:26.9%;left:calc(50% - 1px);width:2px}
    .centre-mark-top,.centre-mark-bottom{left:calc(50% - 1px);width:2px;height:2.6%}.centre-mark-top{top:0}.centre-mark-bottom{bottom:0}
    .net{position:absolute;z-index:4;left:5%;right:5%;top:50%;height:9px;border-block:1px solid rgba(255,255,255,.8);background:repeating-linear-gradient(90deg,rgba(255,255,255,.72) 0 1px,transparent 1px 5px),repeating-linear-gradient(0deg,rgba(255,255,255,.35) 0 1px,transparent 1px 4px);box-shadow:0 4px 8px rgba(0,0,0,.28)}
    .net::before,.net::after{content:"";position:absolute;top:-5px;width:4px;height:20px;border-radius:2px;background:#e9ece9;box-shadow:0 3px 5px rgba(0,0,0,.3)}.net::before{left:-2px}.net::after{right:-2px}
    .ball{position:absolute;z-index:5;top:20%;left:25%;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 33% 28%,#f2ff78 0 8%,var(--ball) 35%,#bacc25 100%);box-shadow:inset -7px -8px 12px rgba(65,87,0,.18),0 14px 18px rgba(0,0,0,.26);animation:serve 5.2s cubic-bezier(.45,.05,.55,.95) infinite}
    .ball::before{content:"";position:absolute;inset:-4px 10px;border:2px solid rgba(255,255,255,.78);border-block-color:transparent;border-radius:50%;transform:rotate(38deg)}
    .score{position:absolute;z-index:6;right:-20px;bottom:9%;width:190px;padding:20px;border:1px solid rgba(255,255,255,.19);border-radius:18px;background:rgba(4,31,23,.9);box-shadow:0 20px 35px rgba(0,0,0,.28);backdrop-filter:blur(12px)}
    .score small{display:block;margin-bottom:7px;color:var(--ball);font-size:.67rem;font-weight:850;letter-spacing:.12em;text-transform:uppercase}.score b{display:block;font-size:1.15rem;letter-spacing:-.03em}.score span{display:block;margin-top:5px;color:var(--muted);font-size:.78rem}
    .site-footer{position:relative;background:linear-gradient(90deg,var(--navy),var(--blue));color:rgba(255,255,255,.72)}
    .site-footer-inner{display:flex;align-items:center;justify-content:space-between;gap:1.5rem;width:min(1080px,calc(100% - 3rem));min-height:72px;margin:0 auto;padding:.9rem 0}
    .site-footer-brand{flex:0 0 auto;color:#fff;font-size:1.3rem;font-weight:850;line-height:1;letter-spacing:-.045em;text-decoration:none}
    .site-footer-links{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:.55rem 1.25rem}.site-footer-links a{color:rgba(255,255,255,.72);font-size:.72rem;font-weight:700;text-decoration:none}.site-footer-links a:first-child{color:#fff}.site-footer-links a:hover{color:#fff;text-decoration:underline;text-underline-offset:.22rem}.site-footer a:focus-visible{outline:3px solid var(--yellow);outline-offset:4px;border-radius:3px}
    @keyframes serve{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(150px,300px) rotate(380deg)}}
    @media(max-width:800px){.shell{min-height:auto;padding:16px 20px 54px}.brand{width:190px;height:52px}main{grid-template-columns:1fr;gap:52px;padding:48px 0 30px}h1{max-width:560px;font-size:clamp(3.45rem,16vw,5.2rem)}.copy{font-size:1.03rem}.visual{width:min(74vw,300px);justify-self:center}.score{right:-8px;width:164px;padding:16px}.ball{width:42px;height:42px}@keyframes serve{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(118px,255px) rotate(380deg)}}}
    @media(max-width:560px){.site-footer-inner{width:calc(100% - 2rem);min-height:0;flex-direction:column;gap:.7rem;padding:1rem 0 calc(1rem + env(safe-area-inset-bottom));text-align:center}.site-footer-brand{font-size:1.2rem}.site-footer-links{justify-content:center;gap:.45rem 1rem}.site-footer-links a{font-size:.68rem}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header><a class="brand" href="/" aria-label="Tournely home"><img src="/tournelymain.png" alt="Tournely — Plan, schedule, compete"></a></header>
    <main>
      <section>
        <div class="status">Temporarily under maintenance</div>
        <h1>Taking a short <span>timeout.</span></h1>
        <p class="copy">We’re giving Tournely a little work behind the scenes. The courts will be ready again soon.</p>
        <a class="contact" href="mailto:hello@tournely.co.uk"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v13H4zM4.5 6l7.5 6 7.5-6"/></svg>Contact us</a>
      </section>
      <div class="visual" aria-hidden="true">
        <div class="court-frame"><div class="court"><i class="line singles-left"></i><i class="line singles-right"></i><i class="line service-top"></i><i class="line service-bottom"></i><i class="line centre-service"></i><i class="line centre-mark-top"></i><i class="line centre-mark-bottom"></i></div><div class="net"></div><div class="ball"></div></div>
        <div class="score"><small>Changeover</small><b>Back on court soon</b><span>Thanks for your patience.</span></div>
      </div>
    </main>
  </div>
  <footer class="site-footer"><div class="site-footer-inner"><a class="site-footer-brand" href="/" aria-label="Tournely homepage">Tournely</a><nav class="site-footer-links" aria-label="Footer navigation"><a href="mailto:hello@tournely.co.uk">hello@tournely.co.uk</a><a href="mailto:hello@tournely.co.uk?subject=Tournely%20privacy">Tournely privacy</a></nav></div></footer>
</body>
</html>
